services:
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://geo:geo@db:5432/yunqi_geo
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yunqi_geo
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo
    volumes: [postgres_data:/var/lib/postgresql/data]
volumes:
  postgres_data:
